[project]
name = "mini-ground-station"
version = "0.1.0"
description = "A miniature satellite ground station: telemetry ingestion, storage, and anomaly alerting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Real orbit propagation. Skyfield brings sgp4 and numpy with it, and
    # builds its timescale from bundled leap-second data, so nothing about
    # flying an orbit needs the network.
    "skyfield>=1.49",
]

[project.optional-dependencies]
# The worker runs on threshold rules alone. Install this extra to also enable
# the IsolationForest / z-score statistical detector.
ml = [
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
mgs-api = "mgs.api.main:run"
mgs-worker = "mgs.worker.__main__:main"
mgs-sim = "mgs.simulator.__main__:main"
mgs-retention = "mgs.retention_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mgs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic writes these; they are generated output, not hand-maintained code.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` / `Query(...)` in a default is how FastAPI declares
# dependencies; it is not the mutable-default bug B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["mgs", "tests"]

[tool.pytest.ini_options]
# "." as well as "src": the shared frame builder lives in tests/conftest.py, and
# without the project root on the path `from tests.conftest import ...` only
# resolves under some invocations of pytest.
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: needs a live PostgreSQL"]
