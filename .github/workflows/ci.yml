name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra ml --extra dev
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mgs
          POSTGRES_PASSWORD: mgs
          POSTGRES_DB: mgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgs -d mgs"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # The integration suite creates and drops its own database next to this one.
      MGS_TEST_DATABASE_URL: postgresql+psycopg://mgs:mgs@localhost:5432/mgs_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra ml --extra dev
      - name: pytest
        run: uv run pytest -q

  stack:
    name: Container stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API to report healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' mgs-api 2>/dev/null || echo starting)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "::error::the API never became healthy"
          exit 1

      - name: The migration actually created the schema
        run: |
          tables=$(docker compose exec -T db psql -U mgs -d mgs -tAc \
            "SELECT count(*) FROM information_schema.tables
             WHERE table_schema='public' AND table_name IN ('passes','telemetry','alerts')")
          echo "tables: $tables"
          [ "$tables" = "3" ]

      - name: Fly a day of real passes
        run: |
          # No --fetch-tle: the bundled element set keeps CI deterministic and
          # off the network. Refreshing it is a deliberate, reviewable commit.
          docker compose --profile demo run --rm \
            sim mgs-sim --duration 24h --time-scale 20000 --seed 7

      - name: Screen the backlog
        # --once waits for the long-running worker's advisory lock rather than
        # treating "someone else is screening" as "nothing left to screen".
        run: docker compose run --rm worker mgs-worker --once

      - name: Telemetry, passes, and alerts all landed
        run: |
          read -r frames passes alerts unscreened <<<"$(docker compose exec -T db \
            psql -U mgs -d mgs -tAF' ' -c \
            "SELECT (SELECT count(*) FROM telemetry),
                    (SELECT count(*) FROM passes),
                    (SELECT count(*) FROM alerts),
                    (SELECT count(*) FROM telemetry WHERE screened_at IS NULL)")"
          echo "frames=$frames passes=$passes alerts=$alerts unscreened=$unscreened"
          [ "$frames" -gt 500 ] || { echo "::error::too few frames ingested"; exit 1; }
          [ "$passes" -ge 2 ] || { echo "::error::the simulator never made a pass"; exit 1; }
          [ "$passes" -le 10 ] || { echo "::error::$passes passes in a day is not orbital mechanics"; exit 1; }
          [ "$alerts" -gt 0 ] || { echo "::error::the worker raised nothing at all"; exit 1; }
          [ "$unscreened" = "0" ] || { echo "::error::the worker left frames unscreened"; exit 1; }

      - name: Writes are refused without a key, reads are not
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' \
            http://localhost:8000/api/v1/passes)
          echo "unauthenticated POST /passes -> $code"
          [ "$code" = "401" ] || { echo "::error::a write endpoint is open"; exit 1; }
          [ "$(curl -s http://localhost:8000/health | grep -o '\"auth\":\"[a-z]*\"')" \
            = '"auth":"enabled"' ] || { echo "::error::the stack is running unauthenticated"; exit 1; }

      - name: The API and the dashboard answer
        run: |
          for path in / /health /api/v1/summary /api/v1/passes /api/v1/alerts \
                      "/api/v1/telemetry/series?buckets=10" /static/dashboard.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: Re-screening the same frames raises no duplicates
        run: |
          # Stop the long-running worker so the one-shot runs below are the only
          # ones screening, and compare two runs from the *same* starting state.
          # Comparing a bulk re-screen against the live worker's incremental one
          # would not test idempotency: the statistical detector is fitted on
          # whatever history had been screened at the time, so it legitimately
          # differs between the two schedules.
          docker compose stop worker
          screen () {
            docker compose exec -T db psql -U mgs -d mgs -c \
              "TRUNCATE alerts; UPDATE telemetry SET screened_at = NULL" >/dev/null
            docker compose run --rm worker mgs-worker --once >/dev/null
            docker compose exec -T db psql -U mgs -d mgs -tAF, -c \
              "SELECT rule, severity, count(*) FROM alerts GROUP BY 1,2 ORDER BY 1,2"
          }
          first=$(screen); second=$(screen)
          echo "run 1:"; echo "$first"
          echo "run 2:"; echo "$second"
          [ "$first" = "$second" ] || { echo "::error::screening is not reproducible"; exit 1; }
          [ -n "$first" ] || { echo "::error::screening raised nothing at all"; exit 1; }
          docker compose start worker

      - name: Retention refuses to run unconfigured, and a dry run deletes nothing
        run: |
          # No policy set: it must refuse rather than pick a default and start
          # deleting a mission's telemetry.
          if docker compose --profile maintenance run --rm retention mgs-retention; then
            echo "::error::retention ran without a policy"; exit 1
          fi
          before=$(docker compose exec -T db psql -U mgs -d mgs -tAc "SELECT count(*) FROM telemetry")
          docker compose --profile maintenance run --rm retention \
            mgs-retention --days 1 --dry-run 2>&1 | tail -1
          after=$(docker compose exec -T db psql -U mgs -d mgs -tAc "SELECT count(*) FROM telemetry")
          echo "frames: $before before the dry run, $after after"
          [ "$before" = "$after" ] || { echo "::error::a dry run deleted something"; exit 1; }

          # Sweep almost everything: what survives must be exactly the frames an
          # alert cites, and no alert may be left pointing at nothing.
          docker compose --profile maintenance run --rm retention \
            mgs-retention --days 0.001 2>&1 | tail -1
          read -r left evidence orphaned <<<"$(docker compose exec -T db psql -U mgs -d mgs -tAF' ' -c \
            "SELECT (SELECT count(*) FROM telemetry),
                    (SELECT count(*) FROM telemetry t
                     WHERE EXISTS (SELECT 1 FROM alerts a WHERE a.telemetry_id = t.id)),
                    (SELECT count(*) FROM alerts a WHERE a.telemetry_id IS NOT NULL
                     AND NOT EXISTS (SELECT 1 FROM telemetry t WHERE t.id = a.telemetry_id))")"
          echo "frames left=$left, of which evidence=$evidence, orphaned alerts=$orphaned"
          [ "$left" = "$evidence" ] || { echo "::error::retention kept frames it should have swept"; exit 1; }
          [ "$orphaned" = "0" ] || { echo "::error::retention deleted a frame an alert cites"; exit 1; }

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
